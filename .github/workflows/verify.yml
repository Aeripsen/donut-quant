name: Verify market terminal
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python evidence model tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Javascript syntax and model tests
        run: |
          node --check docs/assets/engine.mjs
          node --check docs/assets/app.mjs
          node --test tests/test_market_engine.mjs
      - name: Check curated snapshot format
        run: python -m json.tool docs/assets/snapshot.json > /dev/null
